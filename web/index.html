<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>作物病蟲害檢索</title>
  <meta name="description" content="協助農友依症狀查詢蔬菜、果樹、糧食作物的病害、蟲害與營養缺乏，提供特徵圖示與防治方法。">
  <meta name="theme-color" content="#2f6b2a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="病蟲害檢索">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <a class="brand" href="#/" aria-label="回到首頁">
        <img src="icons/icon.svg" alt="" width="32" height="32">
        <span>作物病蟲害檢索</span>
      </a>
      <button type="button" class="install" id="install" hidden>安裝 App</button>
    </div>
    <div class="search-wrap" id="search-wrap">
      <input id="search" type="search" placeholder="搜尋：作物、病名、症狀，例如「番茄 黃化」" autocomplete="off" aria-label="搜尋">
    </div>
  </header>

  <main id="view" class="view">
    <div class="empty">載入中…</div>
  </main>

  <nav class="tabbar" aria-label="主要功能">
    <a href="#/"><span aria-hidden="true">📖</span>瀏覽</a>
    <a href="#/wizard"><span aria-hidden="true">🩺</span>症狀診斷</a>
    <a href="#/about"><span aria-hidden="true">ℹ️</span>關於</a>
  </nav>

  <noscript><p style="padding:16px">本 App 需要啟用 JavaScript。</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
